name: Java CI & Monitor Report

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Configurar Java 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # Ejecutamos los tests REALES. Si fallan, el pipeline se detiene aquí.
    - name: Compilar y Testear
      run: |
        chmod +x mvnw
        ./mvnw clean test

    # Este bloque se ejecuta SIEMPRE, incluso si el anterior falló, para reportar el estado real
    - name: Generar reporte JSON
      if: always() 
      run: |
        # Extraemos éxito/fallo del paso anterior
        STATUS="${{ job.status }}"
        
        # (Opcional) Aquí podrías añadir lógica para leer el archivo XML de sure-fire reports
        # Por ahora, reportamos el estado del job de forma dinámica
        echo '{
          "proyecto": "Login-con-JWT-y-SQL",
          "rama": "${{ github.ref_name }}",
          "commit": "${{ github.sha }}",
          "pipeline": {
            "estado": "'$STATUS'",
            "fecha_ejecucion": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
          },
          "tests": {
            "info": "Ver logs de GitHub Actions para detalles de ejecución"
          },
          "detalles": "Build procesado automáticamente. Estado: '$STATUS'"
        }' > reporte-cicd.json

    - name: Desplegar Reporte a GitHub Pages
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
