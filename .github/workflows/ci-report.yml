name: Generar reporte JSON
      if: always()
      run: |
        echo '{
          "proyecto": "'$(basename $GITHUB_REPOSITORY)'",
          "rama": "${{ github.ref_name }}",
          "commit": "${{ github.sha }}",
          "pipeline": {
            "estado": "${{ job.status }}",
            "fecha_ejecucion": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
          },
          "tests": {
            "exitosos": 0,
            "fallidos": 0,
            "cobertura_codigo": "0%"
          },
          "detalles": "Pipeline ejecutado. Estado: ${{ job.status }}"
        }' > reporte-cicd.json
