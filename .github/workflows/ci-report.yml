name: Java CI & Monitor Report

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Configurar Java 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Compilar y Testear
      run: |
        chmod +x mvnw
        # Ejecutamos tests y permitimos que el paso continúe aunque fallen
        ./mvnw clean package -DskipTests=false || echo "Tests fallaron, procesando resultados..."

    - name: Generar reporte JSON con datos reales
      if: always()
      run: |
        # Definimos variables buscando los archivos que genera Maven
        # Ajusta esta ruta si tu nombre de clase de test es distinto
        REPORT_FILE=$(find target/surefire-reports -name "*.txt" | head -n 1)
        
        if [ -f "$REPORT_FILE" ]; then
          EXITOSOS=$(grep -oP 'Tests run: \K\d+' $REPORT_FILE || echo "0")
          FALLIDOS=$(grep -oP 'Failures: \K\d+' $REPORT_FILE || echo "0")
          ERRORES=$(grep -oP 'Errors: \K\d+' $REPORT_FILE || echo "0")
          TOTAL_FALLIDOS=$((FALLIDOS + ERRORES))
        else
          EXITOSOS=0
          TOTAL_FALLIDOS=0
        fi

        echo '{
          "proyecto": "'$(basename $GITHUB_REPOSITORY)'",
          "rama": "${{ github.ref_name }}",
          "commit": "${{ github.sha }}",
          "pipeline": {
            "estado": "${{ job.status }}",
            "fecha_ejecucion": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
          },
          "tests": {
            "exitosos": '$EXITOSOS',
            "fallidos": '$TOTAL_FALLIDOS',
            "cobertura_codigo": "N/A"
          },
          "detalles": "Pipeline ejecutado. Estado: ${{ job.status }}"
        }' > reporte-cicd.json

    - name: Desplegar Reporte a GitHub Pages
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
